
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090909">
  <title>Catálogo</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <header class="header">
    <div class="brand">CATÁLOGO</div>
    <button id="viewToggle" class="view-toggle" aria-label="Cambiar visualización">
      <span id="viewIcon">▤</span>
    </button>
  </header>

  <main>
    <section id="catalog" class="catalog grid-view"></section>
  </main>

  <section id="productViewer" class="viewer hidden">
    <video id="productVideo" playsinline loop preload="metadata"></video>

    <div class="video-shade"></div>

    <button id="closeViewer" class="close-button" aria-label="Volver">✕</button>
    <button id="soundToggle" class="sound-button" aria-label="Activar sonido">🔊</button>

    <div class="product-info">
      <div id="viewerName" class="viewer-name"></div>
      <div id="viewerPrice" class="viewer-price"></div>
      <p id="viewerDescription" class="viewer-description"></p>
    </div>

    <div class="swipe-hint">DESLIZA PARA VER MÁS</div>
  </section>

  <script src="js/app.js"></script>
</body>
</html>
